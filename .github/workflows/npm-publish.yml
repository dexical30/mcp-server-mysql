name: NPM Publish

# Stages the release via npm Trusted Publishing (OIDC): no NPM_TOKEN secret is
# stored, and npm attaches a provenance attestation linking it to this run.
# The staged version is not installable until a maintainer approves it with
# 2FA on npmjs.com or `npm stage approve <stage-id>`, so a compromised
# workflow cannot publish on its own.
# One-time setup: on npmjs.com → package Settings → Trusted Publisher, add
# this repository and the workflow filename `npm-publish.yml`.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # Trusted publishing needs npm CLI >= 11.5.1. Pin the major so a new
      # npm release can't change install/publish behavior unannounced.
      - name: Update npm
        run: npm install -g npm@12

      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ github.event.release.tag_name }}" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Verify MCP_VERSION matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if ! grep -q "export const MCP_VERSION = \"$PKG_VERSION\";" src/config/index.ts; then
            echo "MCP_VERSION in src/config/index.ts does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # npm ci installs exactly what package-lock.json pins and fails if it is out
      # of sync with package.json. The build bundles these into dist/index.js.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test (unit, no MySQL required)
        run: npx vitest run tests/unit/op-password.test.ts

      - name: Stage release on npm
        run: npm stage publish --access public
