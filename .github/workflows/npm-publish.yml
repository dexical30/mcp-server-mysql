name: NPM Publish

# Publishes via npm Trusted Publishing (OIDC): no NPM_TOKEN secret is stored,
# and npm attaches a provenance attestation linking the package to this run.
# One-time setup: on npmjs.com → package Settings → Trusted Publisher, add
# this repository and the workflow filename `npm-publish.yml`.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      # Trusted publishing needs npm CLI >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Verify release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ github.event.release.tag_name }}" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test (unit, no MySQL required)
        run: pnpm exec vitest run tests/unit/op-password.test.ts

      - name: Publish to NPM
        run: npm publish --access public
